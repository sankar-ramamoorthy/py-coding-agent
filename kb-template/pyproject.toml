[project]
name = "kb-template"
version = "0.1.0"
description = "Portable knowledge-base scaffold: YAML front matter + Obsidian-style markdown, with a validator."
requires-python = ">=3.10"

dependencies = [
    "pyyaml",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["validator*"]
